<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="../../static/style/Style.css">
    <title>Login / Sign Up</title>
</head>
<body>
    <nav class="navbar navbar-expand-md festival-navbar navbar-dark">
        <div class="container">
                <a class="navbar-brand" href="index.html">Music Festival</a>
                <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <div class="navbar-nav ms-auto align-items-md-center">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="create-event.html">Create Event</a>
                    <a class="nav-link" href="booking-history.html">Booking History</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold">Welcome to Music Festival</h1>
            <p>Log in to your account or create a new account.</p>
        </div>
        <div class="row justify-content-center g-4">
            <div class="col-md-5">
                <div class="card shadow-sm h-100">
                    <div class="card-body p-4">
                        <h2 class="mb-4">Log In</h2>
                        <form action="payment.html">
                            <div class="mb-3">
                                <label for="loginEmail"
                                       class="form-label">
                                    Email Address
                                </label>
                                <input type="email"
                                       class="form-control"
                                       id="loginEmail"
                                       placeholder="Enter your email"
                                       required>
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword"
                                       class="form-label">
                                    Password
                                </label>
                                <input type="password"
                                       class="form-control"
                                       id="loginPassword"
                                       placeholder="Enter your password"
                                       required>
                            </div>
                            <button 
                                type="submit"
                                class="btn btn-primary w-100">
                                Log In
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-5">
                <div class="card shadow-sm h-100">
                    <div class="card-body p-4">
                        <h2 class="mb-4">Sign Up</h2>
                        <form action="payment.html">
                            <div class="mb-3">
                                <label for="fullName"
                                       class="form-label">
                                    Full Name
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="fullName"
                                       placeholder="Enter your full name"
                                       required>
                            </div>
                            <div class="mb-3">
                                <label for="signupEmail"
                                       class="form-label">
                                    Email Address
                                </label>
                                <input type="email"
                                       class="form-control"
                                       id="signupEmail"
                                       placeholder="Enter your email"
                                       required>
                            </div>
                            <div class="mb-3">
                                <label for="signupPassword"
                                       class="form-label">
                                    Password
                                </label>
                                <input type="password"
                                       class="form-control"
                                       id="signupPassword"
                                       placeholder="Create a password"
                                       required>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword"
                                       class="form-label">
                                    Confirm Password
                                </label>
                                <input type="password"
                                       class="form-control"
                                       id="confirmPassword"
                                       placeholder="Confirm your password"
                                       required>
                            </div>
                            <button type="submit"
                                    class="btn btn-success w-100">
                                Create Account
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">
                &copy; 2026 Food Festival. All rights reserved.
            </p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
