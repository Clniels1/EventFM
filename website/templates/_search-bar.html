<form method="get" action="{{ url_for('main.search') }}" class="search-container mb-4 mx-auto" style="max-width: 650px;">
    <div class="input-group search-input-group">
        <div class="search-input-wrapper">
            {{ search_form.q(class="form-control search-input", placeholder="Search music festivals...", autocomplete="off", value=query|default('')) }}
        </div>
        <button class="btn btn-outline-secondary search-btn" type="submit">Search</button>
    </div>
    <div class="search-backdrop" aria-hidden="true"></div>
</form>
